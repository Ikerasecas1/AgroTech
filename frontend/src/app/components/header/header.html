<mat-toolbar class="header-toolbar">
  <div class="header-left">
    <button mat-icon-button (click)="onToggleSidebar()" aria-label="Abrir menú de navegación" id="sidebar-toggle-btn">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="header-brand">
      <div class="brand-icon">
        <mat-icon class="brand-leaf">eco</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-name">AgroTech</span>
        <span class="brand-subtitle">Dashboard</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <button mat-icon-button aria-label="Notificaciones" id="notifications-btn" class="header-action-btn">
      <mat-icon>notifications_none</mat-icon>
    </button>
    <div class="user-menu-container">
      <div class="header-avatar" id="user-avatar" (click)="toggleUserMenu()" [class.active]="isUserMenuOpen()">
        <mat-icon>person</mat-icon>
      </div>

      @if (isUserMenuOpen()) {
        <div class="user-dropdown-panel">
          <div class="user-dropdown-header">
            <div class="user-dropdown-avatar">
              <mat-icon>person</mat-icon>
            </div>
            <div class="user-dropdown-info">
              <span class="user-dropdown-name">Carlos Martínez</span>
              <span class="user-dropdown-role">Encargado</span>
            </div>
          </div>
          <div class="user-dropdown-divider"></div>
          <div class="user-dropdown-body">
            <button class="user-dropdown-item" (click)="toggleUserMenu()">
              <mat-icon>account_circle</mat-icon>
              <span>Mi Perfil</span>
            </button>
            <button class="user-dropdown-item" (click)="toggleUserMenu()">
              <mat-icon>settings</mat-icon>
              <span>Configuración</span>
            </button>
          </div>
          <div class="user-dropdown-divider"></div>
          <div class="user-dropdown-footer">
            <button class="user-dropdown-item logout" (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Cerrar Sesión</span>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</mat-toolbar>
