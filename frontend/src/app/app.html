<app-header (toggleSidebar)="onToggleSidebar()" />

<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav
    #sidenav
    mode="side"
    [opened]="isSidebarOpen()"
    class="app-sidenav"
  >
    <app-sidebar />
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
